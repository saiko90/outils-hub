name: calorio push · soir
# Rappel du soir (~19:30 heure suisse en été). N'envoie que si rien n'est noté aujourd'hui (géré côté serveur).
on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X GET -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://outils.ch/api/push-cron?job=dinner"
