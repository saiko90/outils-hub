name: calorio push soir
# Rappel du soir (~19:30 heure suisse en ete). N'envoie que si rien n'est note aujourd'hui (gere cote serveur).
on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher le rappel soir
        run: |
          curl -fsS -X GET -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://outils.ch/api/push-cron?job=dinner"
