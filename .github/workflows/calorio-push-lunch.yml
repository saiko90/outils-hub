name: calorio push midi
# Rappel de midi (12h30 heure suisse), seulement si rien n est note aujourd hui (gere cote serveur).
# Deux horaires UTC (ete + hiver) : le serveur n'envoie que si l'heure de Zurich vaut 12h.
on:
  schedule:
    - cron: "30 10 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher le rappel midi
        run: |
          curl -fsS -X GET -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://outils.ch/api/push-cron?job=lunch&hour=12"
