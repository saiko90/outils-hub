name: calorio push encouragement
# Message d'encouragement (~09:00 heure suisse en ete). Limite a 1x/3 jours par utilisateur cote serveur.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher l'encouragement
        run: |
          curl -fsS -X GET -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://outils.ch/api/push-cron?job=encourage"
