name: calorio push · encouragement
# Message d'encouragement (~09:00 heure suisse en été). Limité à 1×/3 jours par utilisateur côté serveur.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X GET -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://outils.ch/api/push-cron?job=encourage"
